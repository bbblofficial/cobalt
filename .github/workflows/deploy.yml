name: Run Cobalt API + Web with TryCloudflare

on:
  workflow_dispatch:

jobs:
  run-cobalt:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -L --output cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared

      - name: Start Redis
        run: |
          docker run -d --name cobalt-redis --network host redis:7-alpine

      - name: Start Cobalt API (temporary)
        run: |
          docker run -d --name cobalt-api --network host \
            -e API_URL="http://localhost:9000/" \
            -e API_PORT="9000" \
            -e API_LISTEN_ADDRESS="0.0.0.0" \
            -e API_REDIS_URL="redis://localhost:6379" \
            -e CORS_WILDCARD="1" \
            ghcr.io/imputnet/cobalt:11

      - name: Wait for Cobalt API to come up
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/ > /dev/null; then
              echo "API is up"; exit 0
            fi
            sleep 2
          done
          echo "Cobalt API never became ready"; docker logs cobalt-api; exit 1

      - name: Start API Tunnel
        id: api_tunnel
        run: |
          # --protocol http2 avoids QUIC/UDP, which GitHub-hosted runners handle
          # unreliably and which is the most common cause of a quick tunnel
          # silently dropping and reconnecting (= a dead URL baked into the web build)
          ./cloudflared tunnel --protocol http2 --url http://localhost:9000 > /tmp/api_cf.log 2>&1 &
          for i in $(seq 1 60); do
            if grep -qE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' /tmp/api_cf.log; then break; fi
            sleep 2
          done
          cat /tmp/api_cf.log
          API_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' /tmp/api_cf.log | head -n 1)
          if [ -z "$API_URL" ]; then echo "API Tunnel failed"; exit 1; fi
          echo "API_URL=$API_URL" >> "$GITHUB_OUTPUT"

      - name: Restart Cobalt API with correct API_URL
        run: |
          docker stop cobalt-api && docker rm cobalt-api
          docker run -d --name cobalt-api --network host \
            -e API_URL="${{ steps.api_tunnel.outputs.API_URL }}/" \
            -e API_PORT="9000" \
            -e API_LISTEN_ADDRESS="0.0.0.0" \
            -e API_REDIS_URL="redis://localhost:6379" \
            -e CORS_WILDCARD="1" \
            ghcr.io/imputnet/cobalt:11

          # make sure it's actually back up before anything tries to use it
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/ > /dev/null; then
              echo "API is back up"; exit 0
            fi
            sleep 2
          done
          echo "Cobalt API never came back up after restart"; docker logs cobalt-api; exit 1

      - name: Build Cobalt Web UI from Fork
        run: |
          cd web
          corepack enable
          pnpm install --frozen-lockfile
          # WEB_HOST must be a bare host, not a URL with a scheme (cobalt uses it for
          # meta tags, not for building request URLs)
          WEB_DEFAULT_API="${{ steps.api_tunnel.outputs.API_URL }}/" \
          WEB_HOST="localhost:3000" \
          pnpm run build

      - name: Start Cobalt Web UI
        run: |
          cd web
          # IMPORTANT: cobalt's web app uses @sveltejs/adapter-cloudflare (see web/wrangler.jsonc),
          # so `pnpm run build` does NOT produce a plain static "build" folder you can hand to
          # `serve`. It produces a Cloudflare Worker bundle at .svelte-kit/cloudflare
          # (_worker.js + static assets). That mismatch was why the web UI never came up.
          # Serve it with wrangler's local dev server instead, which actually runs the worker.
          pnpm dlx wrangler@4 pages dev .svelte-kit/cloudflare --port 3000 --ip 0.0.0.0 &

          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ > /dev/null; then
              echo "Web UI is up"; exit 0
            fi
            sleep 2
          done
          echo "Web UI never became ready"; exit 1

      - name: Start Web Tunnel
        id: web_tunnel
        run: |
          ./cloudflared tunnel --protocol http2 --url http://localhost:3000 > /tmp/web_cf.log 2>&1 &
          for i in $(seq 1 60); do
            if grep -qE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' /tmp/web_cf.log; then break; fi
            sleep 2
          done
          cat /tmp/web_cf.log
          WEB_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' /tmp/web_cf.log | head -n 1)
          if [ -z "$WEB_URL" ]; then echo "Web Tunnel failed"; exit 1; fi
          echo "WEB_URL=$WEB_URL" >> "$GITHUB_OUTPUT"

      - name: Verify CORS preflight works like a real browser would see it
        run: |
          # Simulate the OPTIONS preflight a browser sends before the real POST /,
          # using the public web tunnel origin exactly as the browser would.
          echo "--- preflight response headers ---"
          curl -sS -i -X OPTIONS "${{ steps.api_tunnel.outputs.API_URL }}/" \
            -H "Origin: ${{ steps.web_tunnel.outputs.WEB_URL }}" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type,accept" | head -n 20
          echo "-----------------------------------"
          echo "If you don't see 'access-control-allow-origin' in the headers above,"
          echo "that's why the browser's POST never goes out even though curl GET works."

      - name: Print Final Links
        run: |
          echo "API TUNNEL LINK: ${{ steps.api_tunnel.outputs.API_URL }}" >> "$GITHUB_STEP_SUMMARY"
          echo "WEB TUNNEL LINK: ${{ steps.web_tunnel.outputs.WEB_URL }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep Alive for 6 Hours (watch for tunnel drops)
        run: |
          ORIGINAL_API="${{ steps.api_tunnel.outputs.API_URL }}"
          ORIGINAL_WEB="${{ steps.web_tunnel.outputs.WEB_URL }}"
          END=$((SECONDS + 21600))
          while [ $SECONDS -lt $END ]; do
            CURRENT_API=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' /tmp/api_cf.log | tail -n 1)
            CURRENT_WEB=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' /tmp/web_cf.log | tail -n 1)
            if [ "$CURRENT_API" != "$ORIGINAL_API" ]; then
              echo "::warning::API quick tunnel reconnected with a NEW url ($CURRENT_API)."
              echo "The web app was built pointing at $ORIGINAL_API, which is now dead."
              echo "This is the quick-tunnel instability issue - consider a named Cloudflare Tunnel instead."
            fi
            if [ "$CURRENT_WEB" != "$ORIGINAL_WEB" ]; then
              echo "::warning::Web quick tunnel reconnected with a NEW url ($CURRENT_WEB)."
            fi
            sleep 60
          done
