name: Run Cobalt with TryCloudflare

on:
  workflow_dispatch:  # اجرای دستی از تب Actions

jobs:
  run-cobalt:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # سقف پیش‌فرض گیت‌هاب برای رانرهای میزبانی‌شده

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ۱. راه‌اندازی Redis (Cobalt برای rate limiting بهش نیاز داره)
      - name: Start Redis
        run: |
          docker run -d --name cobalt-redis \
            --network host \
            redis:7-alpine

      # ۲. اجرای Cobalt API
      - name: Run Cobalt API
        run: |
          docker run -d --name cobalt-api \
            --network host \
            -e API_URL="http://localhost:9000/" \
            -e API_PORT="9000" \
            -e API_LISTEN_ADDRESS="0.0.0.0" \
            -e API_REDIS_URL="redis://localhost:6379" \
            -e CORS_WILDCARD="1" \
            ghcr.io/imputnet/cobalt:10

      # ۳. نصب cloudflared
      - name: Setup cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      # ۴. اجرای Quick Tunnel و استخراج URL
      - name: Start Cloudflare Quick Tunnel
        id: tunnel
        run: |
          # اجرای تونل در پس‌زمینه و ذخیره لاگ
          cloudflared tunnel --url http://localhost:9000 > /tmp/cf.log 2>&1 &
          
          # صبر تا تولید URL
          for i in $(seq 1 30); do
            if grep -q "trycloudflare.com" /tmp/cf.log; then
              break
            fi
            sleep 2
          done
          
          # استخراج URL و نمایش در لاگ
          URL=$(grep -oP 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1)
          echo "Tunnel URL: $URL"
          echo "url=$URL" >> $GITHUB_OUTPUT

      # ۵. نگه داشتن job برای ۶ ساعت
      - name: Keep Alive for 6 Hours
        run: sleep 21600  # 6 * 3600 ثانیه
