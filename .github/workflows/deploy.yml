name: Run Cobalt API + Custom Web Panel with TryCloudflare

on:
  workflow_dispatch:

jobs:
  run-cobalt:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install cloudflared
        run: |
          curl -L --output cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared

      - name: Start Redis
        run: |
          docker run -d --name cobalt-redis --network host redis:7-alpine

      - name: Start Cobalt API (temporary)
        run: |
          docker run -d --name cobalt-api --network host \
            -e API_URL="http://localhost:9000/" \
            -e API_PORT="9000" \
            -e API_LISTEN_ADDRESS="0.0.0.0" \
            -e API_REDIS_URL="redis://localhost:6379" \
            -e CORS_WILDCARD="1" \
            ghcr.io/imputnet/cobalt:11

      - name: Wait for Cobalt API to come up
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/ > /dev/null; then
              echo "API is up"; exit 0
            fi
            sleep 2
          done
          echo "Cobalt API never became ready"; docker logs cobalt-api; exit 1

      - name: Start API Tunnel
        id: api_tunnel
        run: |
          # --protocol http2 avoids QUIC/UDP, which GitHub-hosted runners handle
          # unreliably and which is a common cause of a quick tunnel dropping/reconnecting
          ./cloudflared tunnel --protocol http2 --url http://localhost:9000 > /tmp/api_cf.log 2>&1 &
          for i in $(seq 1 60); do
            if grep -qE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' /tmp/api_cf.log; then break; fi
            sleep 2
          done
          cat /tmp/api_cf.log
          API_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' /tmp/api_cf.log | head -n 1)
          if [ -z "$API_URL" ]; then echo "API Tunnel failed"; exit 1; fi
          echo "API_URL=$API_URL" >> "$GITHUB_OUTPUT"

      - name: Restart Cobalt API with correct API_URL
        run: |
          docker stop cobalt-api && docker rm cobalt-api
          docker run -d --name cobalt-api --network host \
            -e API_URL="${{ steps.api_tunnel.outputs.API_URL }}/" \
            -e API_PORT="9000" \
            -e API_LISTEN_ADDRESS="0.0.0.0" \
            -e API_REDIS_URL="redis://localhost:6379" \
            -e CORS_WILDCARD="1" \
            ghcr.io/imputnet/cobalt:11

          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/ > /dev/null; then
              echo "API is back up"; exit 0
            fi
            sleep 2
          done
          echo "Cobalt API never came back up after restart"; docker logs cobalt-api; exit 1

      - name: Create custom single-file web panel
        run: |
          mkdir -p web
          cat > web/index.html << 'HTML_EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>cobalt (self-hosted)</title>
          <style>
            :root {
              --bg: #f4f4f5;
              --card: #ffffff;
              --text: #18181b;
              --muted: #71717a;
              --border: #e4e4e7;
              --accent: #6366f1;
              --accent-text: #ffffff;
              --error-bg: #fef2f2;
              --error-text: #b91c1c;
              --ok-bg: #f0fdf4;
              --ok-text: #15803d;
              color-scheme: light dark;
            }
            @media (prefers-color-scheme: dark) {
              :root {
                --bg: #0a0a0b;
                --card: #18181b;
                --text: #f4f4f5;
                --muted: #a1a1aa;
                --border: #27272a;
                --accent: #818cf8;
                --accent-text: #0a0a0b;
                --error-bg: #2a1212;
                --error-text: #fca5a5;
                --ok-bg: #0f2418;
                --ok-text: #86efac;
              }
            }
            * { box-sizing: border-box; }
            html, body {
              margin: 0; padding: 0;
              background: var(--bg);
              color: var(--text);
              font-family: ui-monospace, "IBM Plex Mono", "SF Mono", Menlo, Consolas, monospace;
              min-height: 100%;
            }
            body {
              display: flex;
              align-items: center;
              justify-content: center;
              padding: 24px;
              padding-top: calc(24px + env(safe-area-inset-top, 0px));
              padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
            }
            .card {
              width: 100%;
              max-width: 520px;
              background: var(--card);
              border: 1px solid var(--border);
              border-radius: 16px;
              padding: 28px;
            }
            h1 {
              font-size: 18px;
              margin: 0 0 4px;
              display: flex;
              align-items: center;
              gap: 8px;
            }
            .sub {
              color: var(--muted);
              font-size: 13px;
              margin: 0 0 20px;
            }
            .row {
              display: flex;
              gap: 8px;
            }
            input[type="text"], input[type="url"] {
              flex: 1;
              min-width: 0;
              padding: 12px 14px;
              border-radius: 10px;
              border: 1px solid var(--border);
              background: var(--bg);
              color: var(--text);
              font-family: inherit;
              font-size: 14px;
            }
            input[type="text"]:focus, input[type="url"]:focus {
              outline: 2px solid var(--accent);
              outline-offset: 1px;
            }
            button {
              padding: 12px 18px;
              border-radius: 10px;
              border: none;
              background: var(--accent);
              color: var(--accent-text);
              font-family: inherit;
              font-size: 14px;
              font-weight: 600;
              cursor: pointer;
              white-space: nowrap;
            }
            button:disabled { opacity: 0.6; cursor: wait; }
            button.secondary {
              background: transparent;
              color: var(--muted);
              border: 1px solid var(--border);
              font-weight: 500;
            }
            .settings {
              margin-top: 16px;
              border-top: 1px solid var(--border);
              padding-top: 16px;
              display: none;
            }
            .settings.open { display: block; }
            .settings label {
              display: block;
              font-size: 12px;
              color: var(--muted);
              margin-bottom: 6px;
            }
            .toggle-settings {
              background: none;
              border: none;
              color: var(--muted);
              font-size: 12px;
              text-decoration: underline;
              cursor: pointer;
              padding: 0;
              margin-top: 14px;
            }
            .result {
              margin-top: 18px;
              padding: 14px;
              border-radius: 10px;
              font-size: 13px;
              word-break: break-word;
              display: none;
            }
            .result.show { display: block; }
            .result.error { background: var(--error-bg); color: var(--error-text); }
            .result.ok { background: var(--ok-bg); color: var(--ok-text); }
            .result a { color: inherit; font-weight: 700; }
            .picker-item {
              display: flex;
              justify-content: space-between;
              align-items: center;
              gap: 8px;
              padding: 6px 0;
              border-bottom: 1px solid rgba(127,127,127,0.2);
            }
            .picker-item:last-child { border-bottom: none; }
            .spinner {
              width: 14px; height: 14px;
              border: 2px solid rgba(127,127,127,0.3);
              border-top-color: currentColor;
              border-radius: 50%;
              display: inline-block;
              animation: spin 0.7s linear infinite;
              vertical-align: middle;
              margin-right: 6px;
            }
            @keyframes spin { to { transform: rotate(360deg); } }
          </style>
          </head>
          <body>
            <div class="card">
              <h1>cobalt <span style="color:var(--muted); font-weight:400;">· self-hosted</span></h1>
              <p class="sub">paste a link from youtube, tiktok, instagram, etc.</p>
          
              <div class="row">
                <input type="url" id="link" placeholder="https://..." autocomplete="off" />
                <button id="go">download</button>
              </div>
          
              <button class="toggle-settings" id="toggleSettings">settings</button>
          
              <div class="settings" id="settings">
                <label for="apiUrl">API endpoint (saved locally in this browser)</label>
                <div class="row">
                  <input type="text" id="apiUrl" placeholder="https://your-api.trycloudflare.com" />
                  <button class="secondary" id="saveApi">save</button>
                </div>
              </div>
          
              <div class="result" id="result"></div>
            </div>
          
          <script>
          (function () {
            "use strict";
          
            // Injected at deploy time by the workflow; can always be overridden below
            // at runtime without rebuilding anything, which matters because free
            // Cloudflare quick tunnels can rotate to a new hostname mid-session.
            var DEFAULT_API_URL = "__API_URL_PLACEHOLDER__";
            var STORAGE_KEY = "cobalt_api_url";
          
            var $ = function (id) { return document.getElementById(id); };
            var linkInput = $("link");
            var goBtn = $("go");
            var resultEl = $("result");
            var settingsEl = $("settings");
            var apiUrlInput = $("apiUrl");
          
            function getApiUrl() {
              var stored = "";
              try { stored = localStorage.getItem(STORAGE_KEY) || ""; } catch (e) {}
              return (stored || DEFAULT_API_URL).replace(/\/+$/, "");
            }
          
            function setApiUrl(url) {
              try { localStorage.setItem(STORAGE_KEY, url); } catch (e) {}
            }
          
            apiUrlInput.value = getApiUrl();
          
            $("toggleSettings").addEventListener("click", function () {
              settingsEl.classList.toggle("open");
            });
          
            $("saveApi").addEventListener("click", function () {
              var v = apiUrlInput.value.trim();
              if (!v) return;
              setApiUrl(v);
              showResult("ok", "API endpoint saved: " + v);
            });
          
            function showResult(kind, html) {
              resultEl.className = "result show " + kind;
              resultEl.innerHTML = html;
            }
          
            function hideResult() {
              resultEl.className = "result";
              resultEl.innerHTML = "";
            }
          
            function escapeHtml(s) {
              return String(s).replace(/[&<>"']/g, function (c) {
                return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
              });
            }
          
            async function handleDownload() {
              var url = linkInput.value.trim();
              if (!url) {
                showResult("error", "paste a link first.");
                return;
              }
          
              var apiUrl = getApiUrl();
              if (!apiUrl) {
                showResult("error", "no API endpoint configured - open settings and paste one in.");
                return;
              }
          
              goBtn.disabled = true;
              showResult("ok", '<span class="spinner"></span>processing...');
          
              try {
                var res = await fetch(apiUrl + "/", {
                  method: "POST",
                  mode: "cors",
                  headers: {
                    "Accept": "application/json",
                    "Content-Type": "application/json"
                  },
                  body: JSON.stringify({ url: url })
                });
          
                var data;
                try {
                  data = await res.json();
                } catch (parseErr) {
                  showResult(
                    "error",
                    "the server did not return valid JSON (got a non-API response, HTTP " + res.status + "). " +
                    "this usually means the request never reached the cobalt API - check the API endpoint in settings."
                  );
                  return;
                }
          
                if (!res.ok || data.status === "error") {
                  var code = (data && data.error && data.error.code) || ("HTTP " + res.status);
                  showResult("error", "error: " + escapeHtml(code));
                  return;
                }
          
                if (data.status === "redirect" || data.status === "tunnel" || data.status === "local-processing") {
                  var filename = data.filename || "download";
                  showResult(
                    "ok",
                    'ready: <a href="' + data.url + '" target="_blank" rel="noopener">' + escapeHtml(filename) + "</a>"
                  );
                  return;
                }
          
                if (data.status === "picker" && Array.isArray(data.picker)) {
                  var html = "choose an item:<br><br>";
                  data.picker.forEach(function (item, i) {
                    html += '<div class="picker-item"><span>' + (i + 1) + ". " +
                      escapeHtml(item.type || "item") + '</span><a href="' + item.url +
                      '" target="_blank" rel="noopener">open</a></div>';
                  });
                  if (data.audio) {
                    html += '<div class="picker-item"><span>audio</span><a href="' + data.audio +
                      '" target="_blank" rel="noopener">open</a></div>';
                  }
                  showResult("ok", html);
                  return;
                }
          
                showResult("error", "unrecognized response from API: " + escapeHtml(JSON.stringify(data)));
              } catch (networkErr) {
                showResult(
                  "error",
                  "couldn't reach the API at all (network/CORS failure). " +
                  "if the tunnel rotated to a new URL, open settings and update the API endpoint. " +
                  "details: " + escapeHtml(networkErr.message || String(networkErr))
                );
              } finally {
                goBtn.disabled = false;
              }
            }
          
            goBtn.addEventListener("click", handleDownload);
            linkInput.addEventListener("keydown", function (e) {
              if (e.key === "Enter") handleDownload();
            });
          })();
          </script>
          </body>
          </html>
          HTML_EOF

          # Bake in the current API tunnel URL as the default (still overridable at
          # runtime from the settings panel with zero rebuild needed).
          sed -i "s#__API_URL_PLACEHOLDER__#${{ steps.api_tunnel.outputs.API_URL }}#g" web/index.html

      - name: Start Web Panel (plain python http.server - no build step needed)
        run: |
          cd web
          python3 -m http.server 3000 --bind 0.0.0.0 &

          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)
            if [ "$code" = "200" ]; then
              echo "Web panel is up (200 OK)"; exit 0
            fi
            echo "Got HTTP $code, retrying..."
            sleep 2
          done
          echo "::error::Web panel never returned 200 on /"
          exit 1

      - name: Start Web Tunnel
        id: web_tunnel
        run: |
          ./cloudflared tunnel --protocol http2 --url http://localhost:3000 > /tmp/web_cf.log 2>&1 &
          for i in $(seq 1 60); do
            if grep -qE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' /tmp/web_cf.log; then break; fi
            sleep 2
          done
          cat /tmp/web_cf.log
          WEB_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' /tmp/web_cf.log | head -n 1)
          if [ -z "$WEB_URL" ]; then echo "Web Tunnel failed"; exit 1; fi
          echo "WEB_URL=$WEB_URL" >> "$GITHUB_OUTPUT"

      - name: Verify CORS preflight works like a real browser would see it
        run: |
          echo "--- preflight response headers ---"
          curl -sS -i -X OPTIONS "${{ steps.api_tunnel.outputs.API_URL }}/" \
            -H "Origin: ${{ steps.web_tunnel.outputs.WEB_URL }}" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type,accept" | head -n 20
          echo "-----------------------------------"
          echo "If you don't see 'access-control-allow-origin' in the headers above,"
          echo "that's why the browser's POST never goes out even though curl GET works."

      - name: Print Final Links
        run: |
          API_URL="${{ steps.api_tunnel.outputs.API_URL }}"
          WEB_URL="${{ steps.web_tunnel.outputs.WEB_URL }}"

          if [ -z "$API_URL" ]; then
            echo "::error::API_URL is empty - the API tunnel step did not actually produce a link."
            exit 1
          fi
          if [ -z "$WEB_URL" ]; then
            echo "::error::WEB_URL is empty - the Web tunnel step did not actually produce a link."
            exit 1
          fi

          echo "=========================================="
          echo " API  PANEL: $API_URL"
          echo " WEB  PANEL: $WEB_URL"
          echo "=========================================="

          {
            echo "### Cobalt tunnel links"
            echo ""
            echo "| Service | URL |"
            echo "|---|---|"
            echo "| API | $API_URL |"
            echo "| Web | $WEB_URL |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep Alive for 6 Hours (watch for tunnel drops)
        run: |
          ORIGINAL_API="${{ steps.api_tunnel.outputs.API_URL }}"
          ORIGINAL_WEB="${{ steps.web_tunnel.outputs.WEB_URL }}"
          END=$((SECONDS + 21600))
          while [ $SECONDS -lt $END ]; do
            CURRENT_API=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' /tmp/api_cf.log | tail -n 1)
            CURRENT_WEB=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' /tmp/web_cf.log | tail -n 1)
            if [ "$CURRENT_API" != "$ORIGINAL_API" ]; then
              echo "::warning::API quick tunnel reconnected with a NEW url ($CURRENT_API)."
              echo "Open the web panel's settings and paste this new URL in as the API endpoint -"
              echo "no rebuild needed since it's a plain static page now."
            fi
            if [ "$CURRENT_WEB" != "$ORIGINAL_WEB" ]; then
              echo "::warning::Web quick tunnel reconnected with a NEW url ($CURRENT_WEB)."
            fi
            sleep 60
          done
