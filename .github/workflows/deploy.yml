name: Run Cobalt with TryCloudflare

on:
  workflow_dispatch:  # Allows manual trigger from the Actions tab

jobs:
  run-cobalt:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # Maximum allowed time for GitHub-hosted runners (6 hours)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -L --output cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared

      - name: Start Cloudflare Quick Tunnel
        id: tunnel
        run: |
          # Start the tunnel in the background and save logs
          ./cloudflared tunnel --url http://localhost:9000 > /tmp/cf.log 2>&1 &
          
          # Wait up to 120 seconds for the URL to be generated
          for i in $(seq 1 60); do
            if grep -q "trycloudflare.com" /tmp/cf.log; then
              break
            fi
            sleep 2
          done
          
          # Print the entire Cloudflare log for debugging
          echo "--- Cloudflare Log ---"
          cat /tmp/cf.log
          echo "----------------------"
          
          # Extract the URL using a reliable regex pattern
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' /tmp/cf.log | head -n 1)
          
          if [ -z "$URL" ]; then
            echo "Error: Failed to generate Tunnel URL. Check the logs above."
            exit 1
          fi
          
          echo "Tunnel URL: $URL"
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "### Cobalt API URL: $URL" >> $GITHUB_STEP_SUMMARY

      - name: Start Redis
        run: |
          docker run -d --name cobalt-redis \
            --network host \
            redis:7-alpine

      - name: Start Cobalt API
        run: |
          docker run -d --name cobalt-api \
            --network host \
            -e API_URL="${{ steps.tunnel.outputs.url }}/" \
            -e API_PORT="9000" \
            -e API_LISTEN_ADDRESS="0.0.0.0" \
            -e API_REDIS_URL="redis://localhost:6379" \
            -e CORS_WILDCARD="1" \
            ghcr.io/imputnet/cobalt:10

      - name: Keep Alive for 6 Hours
        run: sleep 21600
